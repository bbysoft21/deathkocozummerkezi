version: '3.8'

services:
  # MySQL Veritabanı
  database:
    image: mysql:8.0
    container_name: deathko_db
    restart: always
    environment:
      MYSQL_DATABASE: deathko_cozum_merkezi
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-SecretPassword123!}
      MYSQL_USER: ${DB_USERNAME:-deathko_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-deathko_pass123!}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - deathko_network

  # Laravel API Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deathko_backend
    restart: always
    environment:
      APP_NAME: "DeathKo Çözüm Merkezi"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://cozum.takipthedeathko.com}
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: deathko_cozum_merkezi
      DB_USERNAME: ${DB_USERNAME:-deathko_user}
      DB_PASSWORD: ${DB_PASSWORD:-deathko_pass123!}
    volumes:
      - backend_storage:/var/www/html/storage/app/public
    depends_on:
      - database
    networks:
      - deathko_network

  # React Frontend & Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deathko_frontend
    restart: always
    ports:
      - "8080:80"
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - deathko_network

volumes:
  db_data:
  backend_storage:

networks:
  deathko_network:
    driver: bridge
